<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fff275" />
      <stop offset="70%" stop-color="#ffd32a" />
      <stop offset="100%" stop-color="#ff9f1a" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#54a0ff" />
    </linearGradient>
    <filter id="electricGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ffd32a" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#00d2d3" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Electric Energy Shield/Arc -->
  <path d="M28 2 L14 22 L24 22 L11 44 L18 45 L35 24 L25 24 L36 3 Z" fill="url(#arcGrad)" opacity="0.4" transform="scale(1.08) translate(-1.8, -1.8)"/>
  
  <!-- Shadow/Inking Border -->
  <path d="M28 3 L14 23 L24 23 L11 45 L35 23 L25 23 L36 3 Z" fill="#0c0915" stroke="#0c0915" stroke-width="3.5" stroke-linejoin="miter"/>
  
  <!-- Main Golden Lightning Bolt -->
  <path d="M28 3 L14 23 L24 23 L11 45 L35 23 L25 23 L36 3 Z" fill="url(#boltGrad)" filter="url(#electricGlow)"/>
  
  <!-- White-Hot Core Line -->
  <path d="M27 6 L17 22 L24 22 L16 38 L31 24 L24 24 L33 6 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Sparking Electric Arcs -->
  <path d="M37 16 L42 14 L39 19" stroke="#00d2d3" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M9 28 L5 32 L10 33" stroke="#ffd32a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="39" cy="30" r="1.3" fill="#ffffff"/>
  <circle cx="8" cy="18" r="1.2" fill="#00d2d3"/>
</svg>
