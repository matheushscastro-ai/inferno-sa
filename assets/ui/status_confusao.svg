<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="dazeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a29bfe" />
      <stop offset="70%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#341f97" />
    </radialGradient>
    <filter id="dazeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#a29bfe" flood-opacity="0.9"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Inking -->
  <circle cx="24" cy="24" r="19" fill="#0d0818" stroke="#0d0818" stroke-width="2.5"/>
  <circle cx="24" cy="24" r="18" fill="url(#dazeGrad)" filter="url(#dazeGlow)"/>
  
  <!-- Hypnotic Spiral Arcane Lines -->
  <path d="M24 24 m 0,-15 a 15,15 0 0,1 15,15 a 11,11 0 0,1 -11,11 a 7,7 0 0,1 -7,-7 a 4,4 0 0,1 4,-4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Orbiting Golden Stars -->
  <polygon points="38,8 40,13 45,13 41,16 43,21 38,18 34,21 35,16 31,13 36,13" fill="#ffd32a" stroke="#0d0818" stroke-width="0.8"/>
  <polygon points="9,33 11,37 15,37 12,39 13,43 10,41 6,43 8,39 4,37 8,37" fill="#ffd32a" stroke="#0d0818" stroke-width="0.8"/>
  <polygon points="12,11 13,14 16,14 13,16 14,19 11,17 9,19 10,16 7,14 10,14" fill="#fff" stroke="#0d0818" stroke-width="0.6"/>
</svg>
